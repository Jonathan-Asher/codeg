# The workspace root and the app's own package, `codeg`: `src/main.rs`, the
# Tauri build script and the context generated from tauri.conf.json, and
# nothing else. All of the app's code is the library, crates/codeg-lib. A
# release stamps its version into tauri.conf.json and ships a new interface
# export; both re-run this package's build script and recompile main.rs, and
# neither touches the library.
#
# The other members are the `codeg-mcp` companion and the protocol crate it
# shares with the app: the companion builds on its own (`cargo build -p
# codeg-mcp`), in seconds, without the library.
[workspace]
members = ["crates/codeg-lib", "crates/codeg-mcp-protocol", "crates/codeg-mcp"]
# Commands run here without `-p` or `--workspace` mean the app and its library,
# as they did when both were one package: `cargo test` runs the library's
# tests, and `--bin codeg-server` finds the server binary in the library's
# package.
default-members = [".", "crates/codeg-lib"]
resolver = "2"

# One version for all four: the companion and the app speak a protocol with no
# version field, so they always ship from the same commit.
[workspace.package]
version = "0.32.2"
authors = ["feitao"]
edition = "2021"

[package]
name = "codeg"
version.workspace = true
description = "Agent Code Generation App"
authors.workspace = true
edition.workspace = true
default-run = "codeg"

[features]
default = ["tauri-runtime", "browser-child"]
# The desktop app. The plugins are direct dependencies of this package as well
# as of the library: tauri-build, which runs here, learns each plugin's
# permissions from the `DEP_*` variables cargo passes only to a package's
# direct dependents, and the capabilities grant them.
tauri-runtime = [
    "codeg-lib/tauri-runtime",
    "dep:tauri",
    "dep:tauri-build",
    "dep:serde_json",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-window-state",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-global-shortcut",
]
# The library's features, under the names they have always had here (see
# crates/codeg-lib/Cargo.toml for what each does).
browser-child = ["codeg-lib/browser-child"]
browser-smoke = ["codeg-lib/browser-smoke"]
test-utils = ["codeg-lib/test-utils"]
server = ["codeg-lib/server"]

[[bin]]
name = "codeg"
path = "src/main.rs"
required-features = ["tauri-runtime"]
# main.rs has no tests; this keeps `cargo test` from linking a test harness the
# size of the app for it.
test = false

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
codeg-lib = { path = "crates/codeg-lib", default-features = false }
# The same tauri the library uses (one crate in the build). tauri-build checks
# these features against tauri.conf.json, here, in the package it runs for.
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "devtools"], optional = true }
# `generate_context!` writes the plugin settings from tauri.conf.json as
# `::serde_json::Value`s.
serde_json = { version = "1", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
