name: build-app
on:
  workflow_dispatch:
  push:
    branches: [fork/solution-plan]
    # A docs-only push must not cost a build.
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A newer push supersedes a build still in flight: nobody wants the older one,
# and on the self-hosted runners it would only hold the machine.
concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# WHERE THIS RUNS. Three self-hosted runners on Jonathan's M4 Max (installed in
# ~/actions-runner), so the frontend checks, the Rust checks and the build all
# run side by side. Selected by repository variables:
#   FRONTEND_CHECKS_RUNS_ON = ["self-hosted","codeg-m4-frontend"]
#   CHECKS_RUNS_ON          = ["self-hosted","codeg-m4-checks"]   (Rust)
#   BUILD_RUNS_ON           = ["self-hosted","codeg-m4-build"]
# If the Mac is off for a while, point them back at GitHub's hosted machines
# (slower, but always there), e.g.:
#   gh variable set CHECKS_RUNS_ON --body '"macos-14"'
# Unset variables also fall back to macos-14.
#
# Self-hosted runs keep their workspace between builds (`clean: false`), so
# node_modules and src-tauri/target survive and a build only recompiles what
# changed; GitHub-hosted runs start clean and use rust-cache instead.

jobs:
  checks-frontend:
    runs-on: ${{ fromJSON(vars.FRONTEND_CHECKS_RUNS_ON || '"macos-14"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm eslint .
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Frontend tests
        run: pnpm vitest run

  checks-rust:
    runs-on: ${{ fromJSON(vars.CHECKS_RUNS_ON || '"macos-14"') }}
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: short
      INSTA_UPDATE: "no"
      # Line tables only: backtraces keep file:line, but the debug target is a
      # fraction of full-debuginfo size (it passed 24 GB) and links faster.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: src-tauri
      - name: Keep the build cache bounded
        if: runner.environment == 'self-hosted'
        run: scripts/ci-bound-target.sh src-tauri/target 20
      - name: Rust clippy + tests (desktop)
        working-directory: src-tauri
        env:
          # rust-toolchain pins this to 0 for CI caches; on a persistent
          # workspace incremental debug builds are the whole point.
          CARGO_INCREMENTAL: ${{ runner.environment == 'self-hosted' && '1' || '0' }}
        run: |
          mkdir -p ../out   # tauri-build requires frontendDist to exist
          cargo clippy --all-targets --features test-utils -- -D warnings
          cargo test --features test-utils
      - name: Rust clippy (server) + mcp companion
        working-directory: src-tauri
        env:
          CARGO_INCREMENTAL: ${{ runner.environment == 'self-hosted' && '1' || '0' }}
        run: |
          cargo clippy --no-default-features --bin codeg-server --lib -- -D warnings
          cargo check --no-default-features --bin codeg-mcp

  build:
    runs-on: ${{ fromJSON(vars.BUILD_RUNS_ON || '"macos-14"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: src-tauri
      - name: Keep the build cache bounded
        if: runner.environment == 'self-hosted'
        run: scripts/ci-bound-target.sh src-tauri/target 20
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      # Fork builds carry their own version so the in-app updater — which only
      # installs a strictly newer semver — actually delivers them:
      #   <upstream major.minor.(patch+1)>-fork.<run number>
      # Always above the upstream version the branch is based on, monotonic
      # across fork builds, and it moves up by itself after a rebase.
      #
      # Stamped into the app bundle (tauri.conf.json — what the updater and
      # the embedded server's update check read, see
      # `update::version::running_app_version`) and package.json, but NOT into
      # Cargo.toml: a crate version change alters the crate's metadata hash,
      # which discards every incremental artifact and recompiles the whole
      # crate from scratch on every build. The stamp is undone by the next
      # checkout (a forced checkout resets tracked files).
      - name: Stamp the fork version
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          conf = pathlib.Path("src-tauri/tauri.conf.json")
          data = json.loads(conf.read_text())
          major, minor, patch = (int(x) for x in data["version"].split("-")[0].split("."))
          fork = f"{major}.{minor}.{patch + 1}-fork.{os.environ['GITHUB_RUN_NUMBER']}"
          data["version"] = fork
          conf.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          pkg = pathlib.Path("package.json")
          pkg.write_text(re.sub(r'"version": "[^"]+"', f'"version": "{fork}"', pkg.read_text(), count=1))
          print("fork version:", fork)
          PY
      # `--bundles app`: the .app plus its signed updater archive — all the
      # update feed and the installer use. No DMG step.
      - name: Build app (signed for the fork update feed)
        run: pnpm tauri build --bundles app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Persistent workspace: recompile only what changed. (rust-toolchain
          # pins this to 0 for CI caches, where it would be wasted.)
          CARGO_INCREMENTAL: ${{ runner.environment == 'self-hosted' && '1' || '0' }}
          # The checks job type-checks the frontend; the build need not do it
          # a second time inside `next build`.
          CODEG_BUILD_SKIP_TYPECHECK: "1"
      - name: Assemble release files
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          BUNDLE_DIR=src-tauri/target/release/bundle
          TARGZ=$(find "$BUNDLE_DIR" -name 'codeg.app.tar.gz' | head -1)
          SIG=$(find "$BUNDLE_DIR" -name 'codeg.app.tar.gz.sig' | head -1)
          test -n "$TARGZ" && test -n "$SIG" || { echo "updater artifacts missing"; ls -laR "$BUNDLE_DIR"; exit 1; }
          rm -rf release && mkdir release
          cp "$TARGZ" "$SIG" release/
          cp scripts/install-remote.sh release/install.sh
          DL="https://github.com/Jonathan-Asher/codeg/releases/download/fork-latest/codeg.app.tar.gz"
          cat > release/latest.json <<JSON
          {
            "version": "$VERSION",
            "notes": "codeg fork build $VERSION (${GITHUB_SHA::7}) — auto-updates with features intact",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-aarch64": { "signature": "$(cat "$SIG")", "url": "$DL" }
            }
          }
          JSON
          echo "$VERSION" > release/VERSION
          cat release/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          retention-days: 3

  # Publishing waits for BOTH: nothing reaches the update feed unless the
  # checks passed. Runs on a GitHub-hosted Linux box — it only moves files.
  publish:
    needs: [checks-frontend, checks-rust, build]
    if: github.ref == 'refs/heads/fork/solution-plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Update rolling release (fork-latest)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(cat release/VERSION)
          gh release delete fork-latest -R "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create fork-latest -R "$REPO" \
            --target "$GITHUB_SHA" \
            release/codeg.app.tar.gz \
            release/codeg.app.tar.gz.sig \
            release/latest.json \
            release/install.sh \
            --title "codeg fork $VERSION" \
            --notes "Latest fork build ($VERSION, ${GITHUB_SHA::7}) — signed for the fork update feed; installed apps update from here. Fresh install: curl -sL https://github.com/Jonathan-Asher/codeg/releases/download/fork-latest/install.sh | bash"
