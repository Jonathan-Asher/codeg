name: build-app
on:
  workflow_dispatch:
  push:
    branches: [fork/solution-plan]
    # A docs-only push must not cost a 25-minute build.
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      # Fork builds carry their own version so the in-app updater — which only
      # installs a strictly newer semver — actually delivers them:
      #   <upstream major.minor.(patch+1)>-fork.<run number>
      # Always above the upstream version the branch is based on, monotonic
      # across fork builds, and it moves up by itself after a rebase. Stamped
      # into all three version fields so the app, its embedded server
      # (CARGO_PKG_VERSION, which answers update checks for remote windows)
      # and latest.json agree on what is running.
      - name: Stamp the fork version
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          conf = pathlib.Path("src-tauri/tauri.conf.json")
          data = json.loads(conf.read_text())
          major, minor, patch = (int(x) for x in data["version"].split("-")[0].split("."))
          fork = f"{major}.{minor}.{patch + 1}-fork.{os.environ['GITHUB_RUN_NUMBER']}"
          data["version"] = fork
          conf.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          pkg = pathlib.Path("package.json")
          pkg.write_text(re.sub(r'"version": "[^"]+"', f'"version": "{fork}"', pkg.read_text(), count=1))
          cargo = pathlib.Path("src-tauri/Cargo.toml")
          cargo.write_text(re.sub(r'^version = "[^"]+"', f'version = "{fork}"', cargo.read_text(), count=1, flags=re.M))
          print("fork version:", fork)
          PY
      - name: Build app (signed for the fork update feed)
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # DMG bundling needs a GUI session; the .app + updater artifacts are enough
          TAURI_BUNDLER_DISABLE_DMG: "true"
      - name: Assemble update feed (latest.json)
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          BUNDLE_DIR=src-tauri/target/release/bundle
          # Updater artifact: codeg.app.tar.gz + .sig (created by tauri's updater bundler)
          ls -la "$BUNDLE_DIR" || true
          SIG=$(cat "$BUNDLE_DIR"/codeg.app.tar.gz.sig 2>/dev/null || cat "$BUNDLE_DIR/macos/codeg.app.tar.gz.sig")
          DL="https://github.com/Jonathan-Asher/codeg/releases/download/fork-latest/codeg.app.tar.gz"
          cat > latest.json <<JSON
          {
            "version": "$VERSION",
            "notes": "codeg fork build $VERSION (${GITHUB_SHA::7}) — auto-updates with features intact",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-aarch64": { "signature": "$SIG", "url": "$DL" }
            }
          }
          JSON
          cat latest.json
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeg-app
          path: src-tauri/target/release/bundle/macos/codeg.app
      - name: Update rolling release (fork-latest)
        if: github.ref == 'refs/heads/fork/solution-plan'
        run: |
          BUNDLE_DIR=src-tauri/target/release/bundle
          TARGZ=$(find "$BUNDLE_DIR" -name 'codeg.app.tar.gz' | head -1)
          SIG=$(find "$BUNDLE_DIR" -name 'codeg.app.tar.gz.sig' | head -1)
          echo "updater artifact: $TARGZ / $SIG"
          ditto -c -k --keepParent "$BUNDLE_DIR/macos/codeg.app" codeg-fork.app.zip
          gh release delete fork-latest --yes --cleanup-tag 2>/dev/null || true
          cp scripts/install-remote.sh /tmp/install.sh
          gh release create fork-latest \
            codeg-fork.app.zip \
            "$TARGZ" \
            "$SIG" \
            latest.json \
            /tmp/install.sh \
            --title "codeg fork (auto-build)" \
            --notes "Latest fork build — signed for the fork update feed. Features: cmd+F find-in-chat (+ word highlighting), Pi session fork-points, wake resync, pinned drag-reorder, Markdown export, pi-acp fork/resume. Install: curl -sL https://github.com/Jonathan-Asher/codeg/releases/download/fork-latest/install.sh | bash"
        env:
          GH_TOKEN: ${{ github.token }}
